name: Foundation gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accounting-ai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, tests and security
    runs-on: windows-2025
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/AccountingAI.Web/package-lock.json

      - name: Restore .NET
        shell: pwsh
        run: dotnet restore '.\Accounting AI.slnx'

      - name: Validate synthetic foundation
        shell: pwsh
        run: .\scripts\build.ps1 -SyntheticOnly -NoRestore

      - name: Audit dependencies and secrets
        shell: pwsh
        run: .\scripts\verify-security.ps1
