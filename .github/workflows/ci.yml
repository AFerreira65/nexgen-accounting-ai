name: Foundation gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexgen-accounting-ai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, tests and security
    runs-on: windows-2025
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/NexGenAccountingAI.Web/package-lock.json

      # A imagem windows-2025 traz o PostgreSQL instalado mas com o serviço parado
      # (superutilizador postgres/root). Os testes de integração criam bases descartáveis
      # com o papel accounting criado pelo script de preparação local.
      - name: Start PostgreSQL
        shell: pwsh
        run: |
          $service = Get-Service -Name 'postgresql*' | Select-Object -First 1
          Set-Service -Name $service.Name -StartupType Manual
          Start-Service -Name $service.Name
          $env:PGPASSWORD = 'root'
          & "$env:PGBIN\psql.exe" -U postgres -h localhost -v ON_ERROR_STOP=1 -f scripts/postgres/local-setup.sql
          if ($LASTEXITCODE -ne 0) { throw 'A preparação do PostgreSQL falhou.' }

      - name: Restore .NET
        shell: pwsh
        run: dotnet restore '.\NexGen Accounting AI.slnx'

      - name: Validate synthetic foundation
        shell: pwsh
        run: .\scripts\build.ps1 -SyntheticOnly -NoRestore

      - name: Audit dependencies and secrets
        shell: pwsh
        run: .\scripts\verify-security.ps1
